<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#120000">
  <meta name="robots" content="noindex">
  <title>The Lesson</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{position:relative;background:radial-gradient(ellipse at 50% 105%,#ff3b00 0,#7c0b00 14%,#190000 43%,#000 75%);animation:damnation .18s infinite alternate}
    body:before,body:after{content:"";position:absolute;inset:auto -10% -12%;height:72%;background:radial-gradient(ellipse at 12% 100%,#fff4a0 0 2%,#ff8a00 4%,#e32300 10%,transparent 21%),radial-gradient(ellipse at 35% 110%,#ffd34e 0 3%,#ff4b00 8%,#8d0000 16%,transparent 27%),radial-gradient(ellipse at 61% 105%,#fff0a0 0 2%,#ff6a00 7%,#b41200 15%,transparent 27%),radial-gradient(ellipse at 88% 110%,#ffdc62 0 3%,#ff3b00 9%,#7b0000 18%,transparent 28%);filter:blur(3px) drop-shadow(0 -25px 28px #ff2400);transform-origin:bottom;animation:flame .55s ease-in-out infinite alternate}
    body:after{height:55%;opacity:.72;filter:blur(13px);animation-duration:.32s;transform:scaleX(-1)}
    .lesson-oracle{position:absolute;inset:clamp(1rem,4vw,3rem);z-index:2;display:grid;place-items:center;margin:0;pointer-events:none;filter:drop-shadow(0 0 2rem rgba(255,43,0,.52)) drop-shadow(0 1.5rem 3rem #000)}
    .lesson-oracle img{position:absolute;display:block;width:min(68vw,690px);max-height:88vh;object-fit:contain;transition:opacity .9s ease,transform 1.35s cubic-bezier(.2,.8,.2,1),filter 1.1s ease;transform-origin:50% 58%;will-change:opacity,transform}
    .lesson-oracle-awake{z-index:1;opacity:0;transform:scale(.975);filter:brightness(.56) saturate(.72)}
    .lesson-oracle-dormant{z-index:2;opacity:1;transform:scale(1);filter:brightness(.72) saturate(.78)}
    .lesson-oracle-maw{z-index:3;opacity:0;transform:scale(.96);filter:brightness(.45) saturate(.8) blur(2px)}
    .lesson-oracle.is-awake .lesson-oracle-awake{opacity:1;transform:scale(1.025);filter:brightness(1.04) saturate(1.08)}
    .lesson-oracle.is-awake .lesson-oracle-dormant{opacity:0;transform:scale(1.035);filter:brightness(1.15)}
    .lesson-oracle.is-maw .lesson-oracle-awake{opacity:0;transform:scale(1.07);filter:brightness(1.25) blur(3px)}
    .lesson-oracle.is-maw .lesson-oracle-maw{opacity:1;transform:scale(1.035);filter:brightness(1.02) saturate(1.08) blur(0)}
    .maw-return{position:absolute;z-index:5;left:50%;top:62%;visibility:hidden;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.35);min-width:clamp(110px,14vw,170px);padding:.9rem 1.35rem;color:#ffe7bb;background:linear-gradient(#741500,#260300);border:2px solid #f29a42;box-shadow:0 0 0 3px #210000,0 0 28px #ff3a00,inset 0 0 18px #160000;text-align:center;text-decoration:none;letter-spacing:.23em;font:900 clamp(.72rem,1.4vw,.95rem)/1 Arial,sans-serif;transition:opacity .65s ease .45s,transform .9s cubic-bezier(.15,.85,.2,1.25) .35s,visibility 0s linear 1.1s}
    .lesson-oracle.is-maw .maw-return{visibility:visible;opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);transition-delay:.45s,.35s,0s}
    .maw-return:hover,.maw-return:focus-visible{color:#fff;background:linear-gradient(#a62308,#3b0500);box-shadow:0 0 0 3px #210000,0 0 42px #ff4d0a,inset 0 0 22px #160000;transform:translate(-50%,-50%) scale(1.08)}
    .maw-return:focus-visible{outline:3px solid #fff0c2;outline-offset:5px}
    .glow{position:absolute;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 14vw #ff2600,inset 0 0 32vw #400000;mix-blend-mode:screen;animation:glow .7s ease-in-out infinite alternate}
    canvas{position:absolute;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}
    @keyframes flame{to{transform:scaleY(1.16) skewX(2deg);filter:blur(5px) drop-shadow(0 -40px 38px #ff3900)}}
    @keyframes glow{to{opacity:.58}}
    @keyframes damnation{to{filter:brightness(1.12) contrast(1.08)}}
    @media(max-width:650px){.lesson-oracle img{width:min(92vw,620px);max-height:82vh}.maw-return{top:62%;min-width:105px;padding:.75rem 1rem}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:3s!important}.lesson-oracle img,.maw-return{transition:opacity .15s linear}}
  </style>
</head>
<body>
  <audio id="lessonAudio" src="assets/audio/hell.mp3" autoplay loop preload="auto" playsinline></audio>
  <figure class="lesson-oracle" id="lessonOracle">
    <img class="lesson-oracle-maw" src="assets/oracle/lesson-oracle-maw.png" alt="" aria-hidden="true">
    <img class="lesson-oracle-awake" src="assets/oracle/lesson-oracle-awake.png" alt="The infernal lesson opens its eyes and stares forward">
    <img class="lesson-oracle-dormant" src="assets/oracle/lesson-oracle-dormant.png" alt="" aria-hidden="true">
    <a class="maw-return" href="hells-tales.html#top" role="button">RETURN</a>
  </figure>
  <canvas id="lessonFire" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>
  <script>
    history.replaceState(null,'','lesson.html');
    const oracleFace=document.getElementById('lessonOracle');
    setTimeout(()=>oracleFace.classList.add('is-awake'),matchMedia('(prefers-reduced-motion: reduce)').matches?150:2800);
    setTimeout(()=>oracleFace.classList.add('is-maw'),30000);
    const audio=document.getElementById('lessonAudio');
    audio.volume=1;
    const play=()=>audio.play().catch(()=>{});
    play();
    ['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,play,{once:true,passive:true}));
    const c=document.getElementById('lessonFire'),x=c.getContext('2d');
    let p=[];
    function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
    function ember(){return{x:Math.random()*innerWidth,y:innerHeight+10,r:1+Math.random()*3,v:1.5+Math.random()*5,d:(Math.random()-.5)*1.6,a:.3+Math.random()*.7}}
    function draw(){x.clearRect(0,0,innerWidth,innerHeight);if(p.length<180)for(let i=0;i<4;i++)p.push(ember());p.forEach(o=>{o.y-=o.v;o.x+=o.d;o.a-=.0025;x.beginPath();x.fillStyle=`rgba(255,${60+Math.random()*100},5,${Math.max(0,o.a)})`;x.shadowColor='#ff2a00';x.shadowBlur=12;x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill()});p=p.filter(o=>o.y>-30&&o.a>0);requestAnimationFrame(draw)}
    addEventListener('resize',size);
    size();
    draw();
  </script>
</body>
</html>
