<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120000"><meta name="robots" content="noindex"><title>The Lesson</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{position:relative;background:radial-gradient(ellipse at 50% 105%,#ff3b00 0,#7c0b00 14%,#190000 43%,#000 75%);animation:damnation .18s infinite alternate}body:before,body:after{content:"";position:absolute;inset:auto -10% -12%;height:72%;background:radial-gradient(ellipse at 12% 100%,#fff4a0 0 2%,#ff8a00 4%,#e32300 10%,transparent 21%),radial-gradient(ellipse at 35% 110%,#ffd34e 0 3%,#ff4b00 8%,#8d0000 16%,transparent 27%),radial-gradient(ellipse at 61% 105%,#fff0a0 0 2%,#ff6a00 7%,#b41200 15%,transparent 27%),radial-gradient(ellipse at 88% 110%,#ffdc62 0 3%,#ff3b00 9%,#7b0000 18%,transparent 28%);filter:blur(3px) drop-shadow(0 -25px 28px #ff2400);transform-origin:bottom;animation:flame .55s ease-in-out infinite alternate}body:after{height:55%;opacity:.72;filter:blur(13px);animation-duration:.32s;transform:scaleX(-1)}.glow{position:absolute;inset:0;box-shadow:inset 0 0 14vw #ff2600,inset 0 0 32vw #400000;mix-blend-mode:screen;animation:glow .7s ease-in-out infinite alternate}canvas{position:absolute;inset:0;width:100%;height:100%}@keyframes flame{to{transform:scaleY(1.16) skewX(2deg);filter:blur(5px) drop-shadow(0 -40px 38px #ff3900)}}@keyframes glow{to{opacity:.58}}@keyframes damnation{to{filter:brightness(1.12) contrast(1.08)}}@media(prefers-reduced-motion:reduce){*{animation-duration:3s!important}}</style></head><body><audio id="lessonAudio" src="assets/audio/hell.mp3" autoplay loop preload="auto" playsinline></audio><canvas id="lessonFire" aria-hidden="true"></canvas><div class="glow" aria-hidden="true"></div><script>history.replaceState(null,'','lesson.html');const audio=document.getElementById('lessonAudio');audio.volume=1;const play=()=>audio.play().catch(()=>{});play();['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,play,{once:true,passive:true}));const c=document.getElementById('lessonFire'),x=c.getContext('2d');let p=[];function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}function ember(){return{x:Math.random()*innerWidth,y:innerHeight+10,r:1+Math.random()*3,v:1.5+Math.random()*5,d:(Math.random()-.5)*1.6,a:.3+Math.random()*.7}}function draw(){x.clearRect(0,0,innerWidth,innerHeight);if(p.length<180)for(let i=0;i<4;i++)p.push(ember());p.forEach(o=>{o.y-=o.v;o.x+=o.d;o.a-=.0025;x.beginPath();x.fillStyle=`rgba(255,${60+Math.random()*100},5,${Math.max(0,o.a)})`;x.shadowColor='#ff2a00';x.shadowBlur=12;x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill()});p=p.filter(o=>o.y>-30&&o.a>0);requestAnimationFrame(draw)}addEventListener('resize',size);size();draw();</script></body></html>
